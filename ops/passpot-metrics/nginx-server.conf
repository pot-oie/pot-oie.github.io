# Add these exact-match locations inside passpot.cn's server {} block.
location = /__metrics {
        if ($request_method != POST) {
                return 405;
        }

        limit_req zone=passpot_metrics_limit burst=20 nodelay;
        limit_req_status 429;

        access_log /var/log/nginx/passpot-metrics.log passpot_metrics;

        add_header Cache-Control "no-store" always;
        return 204;
}

location = /dashboard/metrics.json {
        auth_basic "Dashboard";
        auth_basic_user_file /etc/nginx/.htpasswd-dashboard;

        alias /var/lib/passpot/metrics.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
}
