# Add these directives inside nginx.conf's http {} block.
log_format passpot_metrics escape=json
        '{"time":"$time_iso8601",'
        '"event":"$arg_event",'
        '"path":"$arg_path",'
        '"session":"$arg_session",'
        '"query":"$arg_query",'
        '"durationMs":"$arg_duration_ms",'
        '"resultCount":"$arg_result_count",'
        '"depth":"$arg_depth",'
        '"value":"$arg_value"}';

limit_req_zone $binary_remote_addr
        zone=passpot_metrics_limit:10m
        rate=30r/m;
