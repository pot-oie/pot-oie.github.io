    shortReview: "Andy 的人设完全崩塌，Micheal 生态位空缺后编剧似乎没有弥补的思路。如果说上一季靠着很多故事线的尾巴堪堪维持，这一季已经是没话找话了。wall painting, sound man...如果精简到 6 季还可以称得上是一个合格的收尾。"
